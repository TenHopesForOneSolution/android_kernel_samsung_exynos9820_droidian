name: Droidian S10e kernel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the next Build release after a successful main build
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build and validate S10e kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: quay.io/droidian/build-essential@sha256:887ff647029536e2b6d68a5008ce6b5ab38e45721632ca78b1a7ffec0e1a9eeb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check build and release scripts
        run: |
          bash -n droidian/build.sh
          python3 -m unittest discover -s droidian/tests -v
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/droidian
          key: s10e-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('droidian/sources.lock.json', 'droidian/toolchain-files.json') }}
      - name: Build Image, device trees and modules
        run: ./droidian/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s10e-kernel-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish Build release
    needs: build
    if: >-
      github.repository == 'TenHopesForOneSolution/android_kernel_samsung_exynos9820_droidian' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: s10e-kernel-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: s10e-kernel-${{ github.sha }}
          path: dist
      - name: Publish next Build (or resume its draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 droidian/release.py dist
